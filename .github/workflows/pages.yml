name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认最小权限；Pages 写入权限仅授予实际部署 job。
permissions:
  contents: read

# 同一时间只允许一个部署；不要取消正在进行的（否则可能留下半套产物）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned Playwright and Chromium for browser regression
        # Playwright 只用于 CI / 测试，不进入网站运行时依赖。
        # 使用临时目录并固定版本，避免污染仓库，也避免依赖全局 npm 状态。
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_ENTRY=$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Run unit and Chromium browser regression tests
        # CI 中 Playwright 缺失会使浏览器回归失败，不允许静默 skip。
        run: node --test

      - name: Static audit (no network / no persistence / no secrets)
        run: node scripts/check-no-network.mjs

  build:
    name: Build static artifact
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage site directory
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # 让 GitHub Pages 跳过 Jekyll 处理，避免下划线开头的文件被忽略
          touch _site/.nojekyll
          # v5 允许保留 .nojekyll，但不得意外公开其他隐藏文件/目录。
          unexpected_hidden="$(find _site -mindepth 1 -name '.*' ! -name '.nojekyll' -print -quit)"
          if [ -n "$unexpected_hidden" ]; then
            echo "::error::Unexpected hidden site path: $unexpected_hidden"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 默认不上传隐藏文件；保留 .nojekyll 以避免 Jekyll 处理。
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
