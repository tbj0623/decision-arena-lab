<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="示意：当成长因素权重超过百分之五十，方案 A 从落后变为领先"><rect width="1200" height="660" rx="40" fill="#091a2a"/><text x="64" y="90" font-family="Noto Sans CJK SC,sans-serif" font-weight="700" font-size="42" fill="#f4fafb">为什么你的选择会翻转？</text><text x="64" y="132" font-family="Noto Sans CJK SC,sans-serif" font-size="22" fill="#a6c3cc">只改变「成长」这一项的权重，其余按比例重分</text><rect x="65" y="172" width="1067" height="390" rx="28" fill="#113045" stroke="#25516a" stroke-width="2"/><g stroke="#2a4b60" stroke-width="2"><path d="M132 258 H1066 M132 333 H1066 M132 408 H1066 M132 483 H1066"/><path d="M132 228 V483 M365 228 V483 M599 228 V483 M832 228 V483 M1066 228 V483"/></g><path d="M132 465 L1066 233" fill="none" stroke="#5ce8c3" stroke-width="9" stroke-linecap="round"/><path d="M132 280 L1066 420" fill="none" stroke="#ffb878" stroke-width="9" stroke-linecap="round"/><path d="M599 217 V494" stroke="#cbdce1" stroke-width="3" stroke-dasharray="10 9"/><circle cx="599" cy="349" r="14" fill="#f4fafb" stroke="#5ce8c3" stroke-width="6"/><rect x="499" y="180" width="200" height="47" rx="23" fill="#2c5864"/><text x="529" y="212" font-family="Noto Sans CJK SC,sans-serif" font-weight="700" font-size="23" fill="#f4fafb">50% · 打平</text><g fill="#9eb9c5" font-family="Noto Sans CJK SC,sans-serif" font-size="21"><text x="123" y="528">0%</text><text x="564" y="528">50%</text><text x="1009" y="528">100%</text><text x="142" y="609">示意模型：A = 40 + 50t</text><text x="650" y="609">B = 80 − 30t</text></g><text x="76" y="637" font-family="Noto Sans CJK SC,sans-serif" font-size="17" fill="#83a6b3">t 为成长因素的权重占比 · 不是对现实结果的预测</text></svg>